# Render Blueprint for the VTMP API (docs/DEPLOYMENT.md). Values marked sync:false are entered
# in the Render dashboard and never committed.
services:
  - type: web
    name: kiss-vtmp-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @vtmp/api build &&
      DATABASE_URL="$DIRECT_DATABASE_URL" pnpm --filter @vtmp/api db:deploy
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      # Neon pooled connection string (…-pooler…/vtmp?sslmode=require&pgbouncer=true)
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooled) connection string, used only for migrations during build
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      # The final web URL, e.g. https://kiss-vtmp.vercel.app — fixed forever (QR codes use it)
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Render's load balancer + Vercel's rewrite proxy
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: STORAGE_DRIVER
        value: local
      - key: AI_ENABLED
        value: 'false'
