openapi: 3.0.3
info:
  title: KISS VTMP API
  version: 0.1.0
  description: |
    KISS Vocational Training Management Portal API. All endpoints live under /api/v1 and
    return JSON. Errors always use the Error schema below.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: system
  - name: auth
  - name: users
  - name: admin-users
  - name: catalogue
  - name: admin-courses
  - name: enrollments
  - name: admin-enrollments
  - name: notifications
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: App and database are healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password (BRQ-1.1)
      description: |
        Returns a 15-minute access token in the body and sets a 7-day refresh token in the
        httpOnly `vtmp_rt` cookie (path /api/v1/auth). Wrong email, wrong password and
        deactivated accounts all return the same 401. After `auth.maxFailedLogins` failures the
        account is locked for `auth.lockMinutes` (429 ACCOUNT_LOCKED). Rate-limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { schema: { type: string }, description: Refresh token cookie }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and get a new access token
      description: |
        Uses the `vtmp_rt` cookie. Every call rotates the token. Presenting an already-rotated
        token revokes the whole token family (401 REFRESH_TOKEN_REUSED).
      security: []
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token family and clear the cookie
      security: []
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [auth]
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    patch:
      tags: [users]
      summary: Update own profile (BRQ-1.3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/me/password:
    post:
      tags: [users]
      summary: Change own password (BRQ-1.3)
      description: Verifies the current password and signs out every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users:
    get:
      tags: [admin-users]
      summary: List users (Admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: Search name,
            email,
            roll no or employee code,
          }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-users]
      summary: Create a student, trainer or admin account (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/{id}:
    patch:
      tags: [admin-users]
      summary: Rename, change locale, deactivate or reactivate a user (Admin)
      description: Deactivation revokes every session. Admins cannot deactivate themselves (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName: { type: string }
                isActive: { type: boolean }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ─── Sprint 3: catalogue, courses, cycles, enrollment ─────────────────────────
  /courses:
    get:
      tags: [catalogue]
      summary: Course catalogue for a cycle (BRQ-2.2)
      description: Active courses offered in the cycle (default the newest cycle with offerings), with window state and indicative seats remaining.
      parameters:
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycle: { $ref: '#/components/schemas/Cycle' }
                  courses: { type: array, items: { $ref: '#/components/schemas/CatalogueCourse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses/{id}:
    get:
      tags: [catalogue]
      summary: One catalogue course in a cycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Course and cycle }
        '404': { $ref: '#/components/responses/NotFound' }
  /cycles:
    get:
      tags: [catalogue]
      summary: Training cycles, newest first
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cycle' } }

  /admin/courses:
    get:
      tags: [admin-courses]
      summary: All courses incl. inactive (Admin)
      responses:
        { '200': { description: Courses }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [admin-courses]
      summary: Create a course (Admin, BRQ-2.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, description, durationWeeks, seatCapacity]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9-]{2,20}$' }
                title: { type: string }
                description: { type: string }
                durationWeeks: { type: integer, minimum: 1 }
                prerequisites: { type: string, nullable: true }
                seatCapacity: { type: integer, minimum: 1 }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/courses/{id}:
    patch:
      tags: [admin-courses]
      summary: Update a course; isActive=false is the soft delete (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '200': { description: Updated }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/cycles:
    get:
      tags: [admin-courses]
      summary: Training cycles (Admin)
      responses: { '200': { description: Cycles } }
    post:
      tags: [admin-courses]
      summary: Create a training cycle (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startsOn, endsOn]
              properties:
                name: { type: string }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
      responses:
        { '201': { description: Created }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/cycles/{id}:
    patch:
      tags: [admin-courses]
      summary: Rename or re-date a cycle (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Updated } }
  /admin/cycles/{cycleId}/offerings:
    get:
      tags: [admin-courses]
      summary: Every course with its offering (if any) in the cycle (Admin)
      parameters:
        - { name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Course + offering pairs } }
  /admin/cycles/{cycleId}/offerings/{courseId}:
    put:
      tags: [admin-courses]
      summary: Offer a course in a cycle, set its enrollment window and open/close toggle (BRQ-2.3)
      parameters:
        - { name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentOpensAt, enrollmentClosesAt, isOpen]
              properties:
                enrollmentOpensAt: { type: string, format: date-time }
                enrollmentClosesAt: { type: string, format: date-time }
                isOpen: { type: boolean }
      responses:
        '200':
          description: Offering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offering' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /enrollments:
    post:
      tags: [enrollments]
      summary: Apply with 1–3 ranked course preferences (Student, BRQ-3.1)
      description: |
        BR-02: every chosen course must be active with its window open now, else 409
        ENROLLMENT_WINDOW_CLOSED. BR-01: one active application per cycle, else 409
        DUPLICATE_ENROLLMENT. Preference count is limited by setting enrollment.maxPreferences
        (422 TOO_MANY_PREFERENCES). Accepts Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, courseIds]
              properties:
                cycleId: { type: string, format: uuid }
                courseIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  description: In rank order (first = first preference)
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Submitted (PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /enrollments/me:
    get:
      tags: [enrollments]
      summary: My applications with status timeline (Student, BRQ-3.4)
      responses: { '200': { description: Applications, newest first } }
  /enrollments/{enrollmentId}:
    put:
      tags: [enrollments]
      summary: Replace preferences while PENDING and windows open (Student, own)
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /enrollments/{enrollmentId}/withdraw:
    post:
      tags: [enrollments]
      summary: Withdraw a PENDING application while windows are open (Student, own)
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: WITHDRAWN }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/enrollments:
    get:
      tags: [admin-enrollments]
      summary: Review queue, oldest first (Admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
        - {
            name: courseId,
            in: query,
            schema: { type: string, format: uuid },
            description: Any preference,
          }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EnrollmentStatus' } }
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: Student name,
            email or roll no,
          }
      responses: { '200': { description: Page of applications with student details } }
  /admin/enrollments/{id}/approve:
    post:
      tags: [admin-enrollments]
      summary: Approve (Admin, BRQ-3.3). Audited, notifies the student.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: APPROVED }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/enrollments/{id}/reject:
    post:
      tags: [admin-enrollments]
      summary: Reject with a required reason (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string, minLength: 3 } },
              }
      responses:
        {
          '200': { description: REJECTED },
          '422': { $ref: '#/components/responses/ValidationFailed' },
        }
  /admin/enrollments/{id}/waitlist:
    post:
      tags: [admin-enrollments]
      summary: Waitlist with an optional reason (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { description: WAITLISTED } }
  /admin/enrollments/bulk:
    post:
      tags: [admin-enrollments]
      summary: Approve, reject or waitlist up to 200 applications in one transaction (Admin)
      description: All-or-nothing; one unknown id (404) or invalid transition (409) rolls back the batch.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
                action: { type: string, enum: [APPROVE, REJECT, WAITLIST] }
                reason: { type: string, description: Required for REJECT }
      responses:
        '200': { description: '{ action, count, data }' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications/me:
    get:
      tags: [notifications]
      summary: My in-app notifications and unread count
      parameters:
        - { name: unreadOnly, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses: { '200': { description: '{ data, unreadCount }' } }
  /notifications/me/read-all:
    post:
      tags: [notifications]
      summary: Mark all my notifications read
      responses: { '200': { description: '{ updated }' } }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one of my notifications read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '204': { description: Read }, '404': { $ref: '#/components/responses/NotFound' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              example: ENROLLMENT_WINDOW_CLOSED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Health:
      type: object
      required: [status, db, version, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [ok, error] }
        version: { type: string }
        time: { type: string, format: date-time }
    Role: { type: string, enum: [STUDENT, TRAINER, ADMIN] }
    Locale: { type: string, enum: [en, or, hi] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Me:
      type: object
      required: [id, email, fullName, role, locale, student, trainer]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        locale: { $ref: '#/components/schemas/Locale' }
        student:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            rollNo: { type: string }
            cgpa: { type: string, example: '7.50' }
            phone: { type: string, nullable: true }
        trainer:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            employeeCode: { type: string }
            phone: { type: string, nullable: true }
            specialization: { type: string, nullable: true }
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/Me' }
    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        phone: { type: string, nullable: true }
    CreateUserRequest:
      type: object
      required: [role, email, fullName, password]
      description: STUDENT also requires rollNo and cgpa; TRAINER requires employeeCode.
      properties:
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, format: email }
        fullName: { type: string }
        password: { type: string, minLength: 8, maxLength: 72 }
        locale: { $ref: '#/components/schemas/Locale' }
        rollNo: { type: string }
        cgpa: { type: number, minimum: 0, maximum: 10 }
        employeeCode: { type: string }
        specialization: { type: string }
        phone: { type: string }
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        locale: { $ref: '#/components/schemas/Locale' }
        isActive: { type: boolean }
        lockedUntil: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        rollNo: { type: string, nullable: true }
        employeeCode: { type: string, nullable: true }
    EnrollmentStatus:
      type: string
      enum:
        [
          PENDING,
          APPROVED,
          REJECTED,
          WAITLISTED,
          ALLOCATED,
          ACTIVE,
          COMPLETED,
          NOT_COMPLETED,
          CERTIFIED,
          WITHDRAWN,
        ]
    Cycle:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
    Offering:
      type: object
      properties:
        courseId: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        enrollmentOpensAt: { type: string, format: date-time }
        enrollmentClosesAt: { type: string, format: date-time }
        isOpen: { type: boolean }
        windowState: { type: string, enum: [NOT_OFFERED, UPCOMING, OPEN, CLOSED] }
    CatalogueCourse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        durationWeeks: { type: integer }
        prerequisites: { type: string, nullable: true }
        seatCapacity: { type: integer }
        seatsRemaining: { type: integer, description: Indicative }
        offering: { allOf: [{ $ref: '#/components/schemas/Offering' }], nullable: true }
    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        cycleName: { type: string }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        reason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        editable: { type: boolean }
        preferences:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer }
              courseId: { type: string, format: uuid }
              courseCode: { type: string }
              courseTitle: { type: string }
  responses:
    TooManyRequests:
      description: Rate limited or account locked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role or ownership check failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
